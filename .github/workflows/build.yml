name: Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

  build:
    name: Android Preview APK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        id: eas
        run: |
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          URL=$(echo "$OUTPUT" | jq -r '.[0].buildDetailsPageUrl')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Android Preview APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View build on Expo](${{ steps.eas.outputs.url }})" >> $GITHUB_STEP_SUMMARY
